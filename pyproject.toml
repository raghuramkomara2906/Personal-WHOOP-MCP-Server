[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-whoop-mcp"
version = "0.1.0"
description = "Personal MCP server for secure WHOOP health and fitness data access"
requires-python = ">=3.11"

dependencies = [
    "mcp[cli]",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]